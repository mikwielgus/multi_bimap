[package]
name = "multi_bimap"
version = "0.2.0"
authors = ["Mikolaj Wielgus <wielgusmikolaj@gmail.com>"]
description = "Many-to-many bidirectional map in Rust."
repository = "https://github.com/mikwielgus/multi_bimap"
documentation = "https://docs.rs/multi_bimap"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["bidirectional", "bijection", "container", "two-way", "map"]
categories = ["algorithms", "data-structures", "no-std"]
edition = "2024"

[badges]
maintenance = { status = "actively-developed" }

[features]
## Enables `serde` support (derives `Serialize` and `Deserialize` traits).
serde = ["dep:serde"]

## Enables `undoredo` support.
undoredo = ["dep:undoredo"]

[dependencies]
document-features = { version = "0.2", optional = true }
maplike = "0.13.0"
serde = { version = "1.0", optional = true, default-features = false, features = ["derive", "alloc"] }
undoredo = { version = "0.13", features = ["derive"], optional = true }

[package.metadata.docs.rs]
cargo-args = ["--all-features", "-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]
